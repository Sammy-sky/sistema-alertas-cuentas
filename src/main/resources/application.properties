# ── Base de datos Supabase ─────────────────────────────────────
# Configurar estos valores como variables de entorno en Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Zona horaria Lima ──────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.time-zone=America/Lima

# ── Thymeleaf ──────────────────────────────────────────────────
spring.thymeleaf.check-template-location=false

# ── Telegram ───────────────────────────────────────────────────
telegram.bot.token=${TELEGRAM_BOT_TOKEN:${TELEGRAM_TOKEN:}}
telegram.bot.chatId=${TELEGRAM_CHAT_ID:}

# ── Puerto ─────────────────────────────────────────────────────
server.port=${PORT:8080}
