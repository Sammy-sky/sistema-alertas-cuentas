<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Cuentas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/dashboard.css}" rel="stylesheet"/>
  <style>
    body { padding-top: 40px; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-2">
        <span class="brand-icon">⚡</span>
        <h5 class="mb-0 fw-bold text-primary">Estado Público de Cuentas</h5>
      </div>
      <a href="/" class="btn btn-ghost btn-sm d-flex align-items-center gap-2">
        🔒 <span>Panel Admin</span>
      </a>
    </div>
    
    <div class="table-container">
      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Email</th><th>App</th><th>Proyecto</th><th>Reactivación</th><th>Estado</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="text-center text-muted-custom py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
function badgeEstado(estado) {
  const map = {
    'BLOQUEADA':  `<span class="status-badge badge-bloqueada"><span class="pulse-dot"></span>BLOQUEADA</span>`,
    'DISPONIBLE': `<span class="status-badge badge-disponible">DISPONIBLE</span>`,
    'NOTIFICADA': `<span class="status-badge badge-notificada">✓ NOTIFICADA</span>`
  };
  return map[estado] || estado;
}

async function cargar() {
  const res = await fetch('/api/cuentas');
  const data = await res.json();
  const tbody = document.getElementById('tbody');
  
  if(data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted-custom py-4">Sin cuentas registradas</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(c => `
    <tr>
      <td class="font-mono text-primary" style="font-size:13px;">${c.email}</td>
      <td class="text-secondary" style="font-size:13px;">${c.appPlataforma}</td>
      <td class="text-secondary" style="font-size:13px;">${c.proyecto}</td>
      <td class="font-mono text-secondary" style="font-size:12px;">${new Date(c.fechaReactivacion).toLocaleString('es-PE', { dateStyle:'short', timeStyle:'short' })}</td>
      <td>${badgeEstado(c.estado)}</td>
    </tr>
  `).join('');
}

cargar();
setInterval(cargar, 30000);
</script>
</body>
</html>
